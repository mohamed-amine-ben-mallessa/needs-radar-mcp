[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "needs-radar-mcp"
version = "0.1.0"
description = "Reverse B2B prospecting MCP server: detect company investment signals from France Travail job postings, scored by intensity (volume × recency × headcount). Zero dependencies, pure Python stdlib."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Mohamed Amine Ben Mallessa", email = "sollea@sollea-ai.com"}
]
keywords = ["mcp", "prospecting", "b2b", "sales-intelligence", "france-travail", "mcp-server", "lead-generation", "prospection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/mohamed-amine-ben-mallessa/needs-radar-mcp"
Repository = "https://github.com/mohamed-amine-ben-mallessa/needs-radar-mcp"
"France Travail API" = "https://francetravail.io"
Documentation = "https://github.com/mohamed-amine-ben-mallessa/needs-radar-mcp/blob/main/README.md"

[project.scripts]
needs-radar-mcp = "needs_radar_mcp:main"
